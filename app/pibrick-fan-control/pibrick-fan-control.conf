# PWM range while running; fan is off below the stop threshold.
FAN_MIN_PWM=150
FAN_MAX_PWM=255
FAN_START_TEMP=45
FAN_FULL_TEMP=60
# Hysteresis and continuous cool time required to stop.
FAN_STOP_TEMP=43
FAN_STOP_DELAY=10
# EMA time constant and temperature deviation that resets smoothing.
FAN_SMOOTH_SECONDS=5
FAN_TEMP_JUMP=5
# PWM units per second; startup jumps to the minimum working PWM.
FAN_RAMP_UP=30
FAN_RAMP_DOWN=3
